<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Varun K Bhat — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Playfair+Display:ital,wght@0,600;0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b4a80;--blue:#3a78b8;--sky:#a9c8e8;--ice:#e8f1fb;--ink:#05070c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:#02040a;color:#fff;font-family:'Playfair Display',Georgia,serif;font-weight:600}
.stage{position:fixed;top:50%;right:0;transform:translateY(-50%);width:max(100vw,calc(100vh * 1.7728));aspect-ratio:1670/942;background:url("assets/bg.jpg") center/100% 100% no-repeat}
.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#02040acc 0,transparent 55%);pointer-events:none}
.vinyl{position:absolute;z-index:2;left:71.55%;top:52%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;box-shadow:0 12px 40px #000c,0 0 0 2px #ffffff22}
.disc{position:absolute;inset:0;border-radius:50%;animation:spin 3.4s linear infinite;animation-play-state:paused;background:
 conic-gradient(from 0deg,#fff0 0,#ffffff38 8%,#fff0 18%,#fff0 50%,#ffffff2b 58%,#fff0 68%,#fff0 100%),
 repeating-radial-gradient(circle,#0a0c10 0 2px,#1b2028 3px 4px)}
.playing .disc{animation-play-state:running}
.disc:before{content:"";position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--ink) 0 7%,var(--sky) 8% 30%,var(--blue) 31% 100%);box-shadow:0 0 0 3px #0008}
.disc:after{content:"";position:absolute;left:47%;top:35.5%;width:6%;height:6%;border-radius:50%;background:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.pp{all:unset;position:absolute;left:50%;top:50%;width:17%;min-width:34px;aspect-ratio:1;transform:translate(-50%,-50%) scale(.7);border-radius:50%;background:#ffffffee;color:var(--ink);display:grid;place-items:center;opacity:0;transition:opacity .2s,transform .2s;cursor:pointer;box-shadow:0 2px 10px #0008}
.vinyl:hover .pp,.pp:focus-visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (hover:none){.pp{opacity:.85;transform:translate(-50%,-50%) scale(1)}}
.pp svg{width:50%;height:50%;fill:currentColor}
.pp .i-pause{display:none}.playing .pp .i-pause{display:block}.playing .pp .i-play{display:none}
.id{position:fixed;left:4vw;top:3vh;transform:rotate(-4deg);transform-origin:left top;text-shadow:3px 3px 0 var(--navy)}
.id h1{margin:0;font-family:'Abril Fatface',serif;font-weight:400;font-size:clamp(1.8rem,4.2vw,3.6rem);line-height:1}
.id p{margin:.3rem 0 0;font-style:italic;font-size:clamp(.85rem,1.4vw,1.15rem)}
.num{position:fixed;top:-1vh;left:36vw;font-family:'Abril Fatface',serif;font-size:clamp(5rem,14vw,11rem);line-height:1;color:transparent;-webkit-text-stroke:2px #fff;opacity:.9;pointer-events:none}
.menu{position:fixed;left:3vw;top:52%;margin:0;padding:0;list-style:none;transform:translateY(-50%) rotate(-18deg);transform-origin:left center;width:52vw}
.menu li{position:relative;display:block;margin:0 0 .22em;line-height:.9;isolation:isolate}
.menu button{all:unset;cursor:pointer;display:inline-block;font-family:'Abril Fatface',serif;text-transform:uppercase;color:#fff;text-shadow:0 3px 10px #000;font-size:clamp(1.5rem,3.6vw,3rem);transition:font-size .22s,color .22s;padding:.04em .2em}
.menu li.d1 button{font-size:clamp(2.1rem,6vw,5rem)}
.menu li.d0 button{font-size:clamp(3rem,8.5vw,7rem);color:var(--ink);text-shadow:none}
.menu button:focus-visible{outline:none}
.menu li.d0:before{content:"";position:absolute;z-index:-1;left:-6%;right:-8%;top:-12%;bottom:-8%;background:var(--ice);clip-path:polygon(2% 30%,8% 8%,15% 22%,24% 3%,33% 18%,45% 0,55% 14%,67% 2%,78% 20%,90% 6%,97% 34%,100% 52%,94% 74%,99% 92%,84% 84%,70% 100%,58% 86%,44% 98%,30% 84%,18% 96%,10% 78%,0 70%)}
.sub{display:none;position:absolute;left:44%;bottom:-.1rem;background:var(--ink);color:#fff;font-weight:800;font-size:clamp(.75rem,1.3vw,1.1rem);text-transform:uppercase;padding:.25em 1.6em;transform:skewX(-14deg);white-space:nowrap;line-height:1.2;border:1px solid var(--sky)}
.menu li.d0 .sub{display:block}
.open .menu{left:2vw;width:26vw}
.open .menu li.d0 button{font-size:clamp(1.8rem,3.6vw,3rem)}
.open .menu li.d1 button{font-size:clamp(1.4rem,2.6vw,2.2rem)}
.open .menu li.d2 button{font-size:clamp(1.1rem,2vw,1.7rem)}
.open .sub{display:none!important}
.bars{position:fixed;left:0;bottom:11vh;width:min(28vw,380px)}
.bar{display:flex;justify-content:space-between;align-items:center;background:#fff;color:#556;padding:.3rem 2rem .3rem 1.2rem;margin-bottom:.7rem;clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}
.bar small{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.bar b{font-family:'Abril Fatface',serif;font-weight:400;font-size:clamp(1.1rem,2vw,1.7rem);color:var(--navy)}
.btns{position:fixed;left:2vw;bottom:2.4vh;display:flex;gap:1rem}
.btns button{all:unset;cursor:pointer;background:#fff;color:var(--ink);padding:.3rem 1.4rem .3rem .8rem;font-weight:800;display:flex;align-items:center;gap:.5rem;transform:skewX(-14deg)}
.btns button>*{transform:skewX(14deg)}
.btns i{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;color:#fff;font-style:normal;font-size:.8rem}
.btns .a i{background:#2a9d4a}.btns .b i{background:#d6361f}
.btns button:focus-visible{outline:none;background:var(--sky)}
.panel{position:fixed;z-index:5;top:50%;transform:translateY(-50%);max-height:84vh;left:26vw;width:min(34vw,560px);background:#fff;color:var(--ink);padding:2.6rem 3rem 2.6rem 3.4rem;overflow:auto;clip-path:polygon(0 0,96% 0,100% 100%,5% 100%);display:none}
.panel.show{display:block;animation:cut .32s cubic-bezier(.2,.9,.2,1)}
@keyframes cut{from{transform:translate(-60px,-50%) skewX(6deg);opacity:0}}
.panel h2{margin:0 0 1.3rem;font-family:'Abril Fatface',serif;font-weight:400;font-size:clamp(2.3rem,4.6vw,3.8rem);line-height:1;color:var(--navy)}
.panel p{font-size:1.2rem;line-height:1.55;margin:.9rem 0}
.card{border:3px solid var(--ink);padding:1.2rem 1.5rem;margin:1.4rem 0;box-shadow:7px 7px 0 var(--blue);background:#fff}
.card h3{margin:0 0 .3rem;font-family:'Abril Fatface',serif;font-weight:400;font-size:2rem}
.card p{margin:.6rem 0;font-size:1.1rem}
.tag{display:inline-block;background:var(--ink);color:#fff;padding:.1em .8em;margin:.3rem .4rem .3rem 0;font-size:.9rem;font-weight:800;transform:skewX(-12deg)}
.panel a{color:var(--blue);font-weight:800}
a.tag{color:#fff;text-decoration:none}
.social{display:flex;gap:1.3rem;margin-top:2rem}
.panel .social a{display:grid;place-items:center;width:3.6rem;height:3.6rem;background:var(--ink);color:#fff;transform:skewX(-14deg);box-shadow:5px 5px 0 var(--blue);transition:background .15s}
.panel .social a:hover,.panel .social a:focus-visible{background:var(--navy);outline:none}
.social svg{width:1.6rem;height:1.6rem;transform:skewX(14deg)}
.skill{display:inline-block;background:var(--ink);color:#fff;padding:.7rem 1.8rem;margin:.6rem .8rem .6rem 0;transform:skewX(-14deg);font-family:'Abril Fatface',serif;font-size:1.3rem;box-shadow:5px 5px 0 var(--blue)}
.skill:nth-child(3n+2){background:var(--navy)}.skill:nth-child(3n){background:var(--blue)}
.skill>span{display:block;transform:skewX(14deg)}
.stat{display:flex;align-items:center;gap:.8rem;margin:1rem 0}
.stat b{width:8.5em;font-family:'Abril Fatface',serif;font-weight:400;font-size:1.05rem}
.track{flex:1;height:15px;background:#d6dde6;transform:skewX(-20deg);border:3px solid var(--ink)}
.track i{display:block;height:100%;width:0;background:var(--blue);transition:width .8s .15s}
.stat span{width:4.5em;text-align:right;font-weight:800;font-size:.95rem}
.call{display:inline-block;margin:1.2rem 0 .4rem;background:var(--navy);color:#fff!important;font-family:'Abril Fatface',serif;font-weight:400!important;font-size:1.5rem;padding:.2em 1.2em;text-decoration:none;box-shadow:6px 6px 0 var(--ink);transform:skewX(-10deg)}
@media (max-aspect-ratio:1/1){
 .stage{right:auto;left:50%;top:30vh;transform:translate(-71.5%,-52%);width:calc(100vh * 1.7728)}
 .stage:after{background:linear-gradient(0deg,#02040add 0,transparent 60%)}
 .menu{left:5vw;top:68%;width:90vw;transform:translateY(-50%) rotate(-10deg)}
 .menu li.d0 button{font-size:clamp(2.6rem,13vw,4.5rem)}
 .menu li.d1 button{font-size:clamp(1.8rem,8vw,3rem)}
 .menu button{font-size:clamp(1.3rem,6vw,2.2rem)}
 .open .menu li.d0 button,.open .menu li.d1 button,.open .menu button{font-size:1.3rem}
 .sub{left:36%}
 .num,.bars{display:none}
 .id{left:5vw;top:2vh}
 .panel{top:6vh;transform:none;max-height:80vh;left:3vw;width:94vw;clip-path:none;padding:1.8rem 1.6rem}
 .panel.show{animation:none}
 .stat{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){.panel.show{animation:none}.menu button,.track i{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="vinyl" id="vinyl" title="Music"><div class="disc"></div><button class="pp" id="pp" aria-label="Play or pause music"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button></div></div>
<audio id="bgm" loop preload="auto" src="assets/bgm.mp3"></audio>
<div class="num" id="num">1</div>
<div class="id"><h1>Varun K Bhat</h1><p>Computer Science &amp; Engineering student</p></div>
<ul class="menu" id="menu" aria-label="Sections"></ul>
<div class="btns"><button class="a" id="ok"><i>A</i><span>Confirm</span></button><button class="b" id="back"><i>B</i><span>Back</span></button></div>
<section class="panel" id="panel" aria-live="polite"></section>

<script>
(function(){
var S=[
{k:'About',s:'Who I am',h:'<p>Hi I\'m Varun, I like to work on cybersecurity stuff, mainly cuz it\'s cool.</p><p>Other than my projects I\'m into Photography, Cooking, and Gaming</p><p>You can check out my work on GitHub and Instagram.'},
{k:'Projects',s:'Shield & ThirdEye',h:'<div class="card"><h3>Shield</h3><p>A Manifest V3 browser extension that blocks phishing pages and malware while you browse.</p><span class="tag">Browser extension</span><span class="tag">Manifest V3</span><span class="tag">Anti-phishing</span><span class="tag">Anti-malware</span><span class="tag">Aetherion 2026</span><p><a href="https://github.com/Nerdyahhfellow/CodeMAXXERS-" target="_blank" rel="noopener">View on GitHub</a></p></div><div class="card"><h3>ThirdEye</h3><p>An Android APK threat analysis platform built at CIDECODE 2026. Upload an app and get a threat assessment.</p><span class="tag">Android</span><span class="tag">APK analysis</span><span class="tag">Threat detection</span><span class="tag">Static Analysis</span><span class="tag">Dynamic Analysis</span><span class="tag">C2 Beacon Detection</span><p><a href="https://github.com/Nerdyahhfellow/PhantomForks-C2" target="_blank" rel="noopener">View on GitHub</a></p></div>'},
{k:'Hackathons',s:'CIDECODE · Aetherion',h:'<div class="card"><h3>CIDECODE 2026</h3><p>Hosted at PES University. I built <b>ThirdEye</b> here, an Android APK threat analysis platform using static and dynamic analysis with C2 beacon detection.</p><span class="tag">PESU</span><span class="tag">2026</span><span class="tag">Cybersecurity</span></div><div class="card"><h3>Aetherion 2026</h3><p>Hosted at Canara Engineering College. I built <b>Shield</b> here, a browser extension against phishing and malware.</p><span class="tag">Canara Engineering College</span><span class="tag">2026</span><span class="tag">Shield</span></div>'},
{k:'Skills',s:'Skill set',h:'<span class="skill"><span>Python</span></span><span class="skill"><span>Flask</span></span><span class="skill"><span>JavaScript</span></span><span class="skill"><span>HTML &amp; CSS</span></span><span class="skill"><span>Android Studio</span></span><span class="skill"><span>C2 Beacon Detection</span></span><span class="skill"><span>Photography</span></span><span class="skill"><span>Lightroom</span></span><span class="skill"><span>Color Grading</span></span>'},
{k:'Contact',s:'Say Hi',h:'<p>Want to build something or talk security? Contact me.</p><a class="call" href="mailto:varunbhatkk@gmail.com">Email me</a><div class="social"><a href="https://github.com/Varun-K-Bhat" target="_blank" rel="noopener" aria-label="GitHub"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a><a href="https://www.linkedin.com/in/varun-bhat-60958236a/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V16M12 16v-3.5c0-1.4 1-2.2 2.2-2.2S16.5 11.1 16.5 12.5V16"/><circle cx="8" cy="7.6" r=".6" fill="currentColor"/></svg></a><a href="https://www.instagram.com/pok_va_/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></svg></a></div>'}
];
var menu=document.getElementById('menu'),panel=document.getElementById('panel'),num=document.getElementById('num'),cur=0,isOpen=false,btn=[],lis=[];
S.forEach(function(x,i){
 var li=document.createElement('li'),b=document.createElement('button'),sub=document.createElement('span');
 b.textContent=x.k;sub.className='sub';sub.textContent=x.s;
 b.addEventListener('mouseenter',function(){sel(i)});
 b.addEventListener('focus',function(){if(cur!==i)sel(i,1)});
 b.addEventListener('click',function(){sel(i);open()});
 li.appendChild(b);li.appendChild(sub);menu.appendChild(li);btn.push(b);lis.push(li);
});
function sel(i,nf){
 cur=(i+S.length)%S.length;
 lis.forEach(function(li,n){li.className='d'+Math.min(Math.abs(n-cur),2)});
 num.textContent=cur+1;
 if(!nf&&document.activeElement!==btn[cur])btn[cur].focus({preventScroll:true});
 if(isOpen)render();
}
function render(){
 panel.innerHTML='<h2>'+S[cur].k+'</h2>'+S[cur].h;panel.scrollTop=0;
 [].forEach.call(panel.querySelectorAll('.track i'),function(t){setTimeout(function(){t.style.width=t.dataset.v+'%'},60)});
}
function open(){isOpen=true;document.body.classList.add('open');panel.classList.add('show');render()}
function close(){isOpen=false;document.body.classList.remove('open');panel.classList.remove('show')}
document.getElementById('ok').addEventListener('click',open);
document.getElementById('back').addEventListener('click',close);
document.addEventListener('keydown',function(e){
 if(e.key==='ArrowDown'){e.preventDefault();sel(cur+1)}
 else if(e.key==='ArrowUp'){e.preventDefault();sel(cur-1)}
 else if(e.key==='Escape'){close()}
 else if(e.key==='Enter'&&e.target===document.body){open()}
});
sel(0,1);

/* music */
var a=document.getElementById('bgm'),vinyl=document.getElementById('vinyl'),started=false;
a.volume=.6;
function ui(){vinyl.classList.toggle('playing',!a.paused);document.getElementById('stage').classList.toggle('playing',!a.paused)}
a.addEventListener('play',ui);a.addEventListener('pause',ui);
vinyl.addEventListener('click',function(){started=true;rm();if(a.paused){a.play().catch(function(){})}else{a.pause()}});
var ev=['pointerdown','keydown','touchstart'];
function kick(e){
 if(started)return;
 if(e.target&&e.target.closest&&e.target.closest('#vinyl'))return;
 a.play().then(function(){started=true;rm()}).catch(function(){});
}
function rm(){ev.forEach(function(n){document.removeEventListener(n,kick,true)})}
ev.forEach(function(n){document.addEventListener(n,kick,true)});
a.play().then(function(){started=true;rm()}).catch(function(){});
})();
</script>
</body>
</html>
